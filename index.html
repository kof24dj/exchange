<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣外幣近 5 年歷史匯率看板</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm text-center">
            <h1 class="text-2xl font-bold text-gray-800">近 5 年外幣匯率歷史走勢</h1>
            <p class="text-sm text-gray-500 mt-1" id="update-time">正在連線本地服務獲取 5 年大數據，請稍候...</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-600">
                <div class="text-sm font-semibold text-gray-400">美金 (USD) 最新</div>
                <div class="text-3xl font-bold text-gray-800 mt-2" id="card-USD">--</div>
                <div class="text-xs text-gray-400 mt-1">1 美金可換台幣</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-600">
                <div class="text-sm font-semibold text-gray-400">日圓 (JPY) 最新</div>
                <div class="text-3xl font-bold text-gray-800 mt-2" id="card-JPY">--</div>
                <div class="text-xs text-gray-400 mt-1">1 日圓可換台幣</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-purple-600">
                <div class="text-sm font-semibold text-gray-400">歐元 (EUR) 最新</div>
                <div class="text-3xl font-bold text-gray-800 mt-2" id="card-EUR">--</div>
                <div class="text-xs text-gray-400 mt-1">1 歐元可換台幣</div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-600">
                <div class="text-sm font-semibold text-gray-400">越南盾 (VND) 最新 🌟</div>
                <div class="text-3xl font-bold text-gray-800 mt-2" id="card-VND">--</div>
                <div class="text-xs text-gray-400 mt-1">1 台幣可換越南盾</div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-gray-800" id="chart-title">5年走勢圖</h2>
                <div class="flex space-x-2">
                    <button onclick="updateChart('USD')" class="px-3 py-1.5 bg-blue-600 text-white text-sm rounded shadow hover:bg-blue-700 transition">美金</button>
                    <button onclick="updateChart('JPY')" class="px-3 py-1.5 bg-green-600 text-white text-sm rounded shadow hover:bg-green-700 transition">日圓</button>
                    <button onclick="updateChart('EUR')" class="px-3 py-1.5 bg-purple-600 text-white text-sm rounded shadow hover:bg-purple-700 transition">歐元</button>
                    <button onclick="updateChart('VND')" class="px-3 py-1.5 bg-red-600 text-white text-sm rounded shadow hover:bg-red-700 transition">越南盾</button>
                </div>
            </div>
            <div class="relative w-full h-[450px]">
                <canvas id="rateChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let rawData = {};
        let myChart = null;

        async function fetchRates() {
            try {
                const response = await fetch('https://exchange-m5tf.onrender.com/api/rates');
                rawData = await response.json();
                displayCards();
                updateChart('USD'); 
            } catch (error) {
                console.error("無法取得匯率資料:", error);
                document.getElementById('update-time').innerHTML = "<span class='text-red-500 font-bold'>❌ 本地伺服器連線失敗。</span>";
            }
        }

        function displayCards() {
            const currencies = ['USD', 'JPY', 'EUR', 'VND'];
            currencies.forEach(code => {
                const list = rawData[code];
                if (list && list.length > 0) {
                    const latest = list[list.length - 1];
                    if (code === 'VND') {
                        document.getElementById(`card-${code}`).innerText = latest.rate.toFixed(2) + ' VND';
                    } else {
                        document.getElementById(`card-${code}`).innerText = latest.rate.toFixed(2) + ' TWD';
                    }
                    document.getElementById('update-time').innerText = `已成功載入 5 年歷史數據（最新資料日期：${latest.date}）`;
                }
            });
        }

        function updateChart(currency) {
            const currencyData = rawData[currency];
            const names = { 
                USD: '美金 (USD) [1外幣兌台幣]', 
                JPY: '日圓 (JPY) [1外幣兌台幣]', 
                EUR: '歐元 (EUR) [1外幣兌台幣]', 
                VND: '越南盾 (VND) [1台幣兌外幣] 🌟' 
            };
            document.getElementById('chart-title').innerText = `${names[currency]} 5年歷史趨勢`;

            if (!currencyData || currencyData.length === 0) return;

            const ctx = document.getElementById('rateChart').getContext('2d');
            const labels = currencyData.map(item => item.date);
            const rates = currencyData.map(item => item.rate);

            if (myChart) myChart.destroy();

            const colors = { USD: '#2563eb', JPY: '#16a34a', EUR: '#9333ea', VND: '#dc2626' };

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: currency === 'VND' ? '1 台幣可換越南盾數量' : '外幣價格 (TWD)',
                        data: rates,
                        borderColor: colors[currency],
                        backgroundColor: colors[currency] + '0D',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        fill: true,
                        tension: 0.05
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { maxTicksLimit: 12, maxRotation: 0 }
                        },
                        y: {
                            ticks: {
                                callback: function(value) { return value.toFixed(2); }
                            }
                        }
                    }
                }
            });
        }
        fetchRates();
    </script>
</body>
</html>
